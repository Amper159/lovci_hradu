<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lovci Hradů - Průvodce po památkách</title>

    <!-- Google Fonts & FontAwesome ikony -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style> 
        :root {
            --primary: #1e293b;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --success: #10b981;
            --purple: #8b5cf6;
            --purple-hover: #7c3aed;
            --amber: #f59e0b;
            --amber-hover: #d97706;
            --bg-sidebar: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
        }

        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            background-color: #f8fafc;
            color: var(--text-main);
        }

        header {
            background-color: var(--primary);
            color: #ffffff;
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            z-index: 1000;
        }

        header h2 {
            margin: 0;
            font-size: 1.25rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .auth-buttons button {
            background: var(--accent);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            margin-left: 8px;
            font-weight: 600;
            font-size: 0.875rem;
            transition: all 0.2s;
        }
        .auth-buttons button:hover { background: var(--accent-hover); }
        .auth-buttons button.profile { background: var(--purple); }
        .auth-buttons button.profile:hover { background: var(--purple-hover); }
        .auth-buttons button.leaderboard { background: var(--amber); }
        .auth-buttons button.leaderboard:hover { background: var(--amber-hover); }
        .auth-buttons button.logout { background: #ef4444; }

        .main-container {
            display: flex;
            flex-grow: 1;
            overflow: hidden;
        }

        /* Boční panel */
        .sidebar {
            width: 320px;
            background-color: var(--bg-sidebar);
            padding: 24px;
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 20px;
            z-index: 500;
            box-shadow: 2px 0 8px rgba(0,0,0,0.02);
            overflow-y: auto;
        }

        .sidebar h3 { 
            margin: 0; 
            font-size: 1.1rem; 
            font-weight: 700; 
            color: var(--primary); 
        }

        .filter-section {
            display: flex;
            flex-direction: column;
            gap: 8px;
            position: relative;
        }

        .filter-label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Našeptávač */
        .autocomplete-results {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            max-height: 220px;
            overflow-y: auto;
            z-index: 1000;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            margin-top: 4px;
        }

        .autocomplete-item {
            padding: 10px 12px;
            cursor: pointer;
            border-bottom: 1px solid #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.88rem;
        }

        .autocomplete-item:last-child { border-bottom: none; }
        .autocomplete-item:hover { background-color: #f8fafc; color: var(--accent); }

        .type-pills {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .type-pill {
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            background: #f1f5f9;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
            user-select: none;
        }

        .type-pill.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        select, input[type="date"], textarea {
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            width: 100%;
            font-family: inherit;
            font-size: 0.9rem;
            background-color: #ffffff;
            color: var(--text-main);
        }

        .btn-gps {
            background: #0284c7;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.88rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background 0.2s;
        }
        .btn-gps:hover { background: #0369a1; }

        .checkbox-card {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            background: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
        }
        .checkbox-card input { cursor: pointer; }

        .stats-badge {
            margin-top: auto;
            padding: 12px;
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            border-radius: 8px;
            color: #1e40af;
            font-size: 0.85rem;
            font-weight: 600;
            text-align: center;
        }

        #map { flex-grow: 1; height: 100%; }

        /* Popup okna */
        .castle-popup { text-align: center; max-width: 260px; font-family: 'Inter', sans-serif; }
        .castle-popup img { width: 100%; height: 120px; object-fit: cover; border-radius: 6px; margin-bottom: 8px; }
        .castle-popup h3 { margin: 4px 0; font-size: 1rem; font-weight: 700; color: var(--primary); }
        .castle-popup .badge { display: inline-block; padding: 2px 8px; background: #e2e8f0; font-size: 0.75rem; border-radius: 12px; font-weight: 600; margin-bottom: 8px; }
        
        .popup-links {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin: 10px 0;
        }

        .popup-link-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            text-decoration: none;
            padding: 8px 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            color: #ffffff !important;
            transition: opacity 0.2s;
        }
        .popup-link-btn i { color: #ffffff !important; }
        .popup-link-btn:hover { opacity: 0.9; }

        .btn-food { background-color: #d97706 !important; }
        .btn-web { background-color: #1e293b !important; }

        .btn-hunt {
            background-color: #ef4444; color: white; border: none;
            padding: 9px; border-radius: 6px; cursor: pointer; width: 100%;
            font-weight: 600; font-size: 0.85rem; transition: background 0.2s;
        }
        .btn-hunt.visited { background-color: var(--success); }

        /* Modální okna */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); z-index: 2000;
            justify-content: center; align-items: center;
        }
        .modal-content {
            background: white; padding: 28px; border-radius: 12px; width: 360px;
            display: flex; flex-direction: column; gap: 12px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1);
        }
        .modal-content input, .modal-content textarea { padding: 10px; border: 1px solid var(--border-color); border-radius: 6px; font-family: inherit; }
        .modal-content button { background: var(--success); color: white; border: none; padding: 10px; border-radius: 6px; cursor: pointer; font-weight: 600; }
        .close-btn { background: #94a3b8 !important; }

        .profile-item, .leaderboard-item {
            display: flex; align-items: center; gap: 12px; padding: 10px;
            border: 1px solid var(--border-color); border-radius: 8px;
            background: #f8fafc; transition: all 0.2s;
        }
        .profile-item { cursor: pointer; }
        .profile-item:hover {
            background: #f1f5f9; border-color: var(--accent); transform: translateY(-1px);
        }

        .rank-badge {
            width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
            border-radius: 50%; font-weight: 700; font-size: 0.9rem; background: #e2e8f0; color: #475569;
        }
        .rank-1 { background: #fef08a; color: #854d0e; border: 1px solid #fde047; }
        .rank-2 { background: #e2e8f0; color: #334155; border: 1px solid #cbd5e1; }
        .rank-3 { background: #ffedd5; color: #9a3412; border: 1px solid #fed7aa; }

        .star-rating {
            display: flex;
            gap: 8px;
            font-size: 1.5rem;
            cursor: pointer;
            color: #cbd5e1;
            justify-content: center;
        }
        .star-rating .fa-star.active {
            color: #f59e0b;
        }
    </style>
</head>

function clearRoute() {
    if (routeLayer) {
        map.removeLayer(routeLayer);
        routeLayer = null;
    }
    document.getElementById('route-info-box').style.display = 'none';
}

async function showRouteOnMap(toLat, toLon, profile) {
    if (!userLat || !userLon) {
        return alert('Nejdříve klikni na "Najít mou polohu" v sidebaru!');
    }

    clearRoute(); // Vyčistíme případnou předchozí trasu

    let url = '';
    if (profile === 'car') {
        url = `https://router.project-osrm.org/route/v1/driving/${userLon},${userLat};${toLon},${toLat}?overview=full&geometries=geojson`;
    } else {
        url = `https://routing.openstreetmap.de/routed-foot/route/v1/driving/${userLon},${userLat};${toLon},${toLat}?overview=full&geometries=geojson`;
    }

    try {
        const response = await fetch(url);
        const data = await response.json();

        if (!data.routes || data.routes.length === 0) {
            return alert('Trasu se nepodařilo spočítat.');
        }

        const route = data.routes[0];
        const coordinates = route.geometry.coordinates.map(coord => [coord[1], coord[0]]);
        const distanceKm = (route.distance / 1000).toFixed(1);

        let durationMin = 0;
        if (profile === 'car') {
            durationMin = Math.round(route.duration / 60);
        } else {
            durationMin = Math.round((distanceKm / 4.2) * 60);
        }

        const hours = Math.floor(durationMin / 60);
        const mins = durationMin % 60;
        const timeText = hours > 0 ? `${hours} hod ${mins} min` : `${mins} min`;

        // Vykreslení čáry na tvé mapě
        if (profile === 'car') {
            routeLayer = L.polyline(coordinates, { 
                color: '#2563eb', 
                weight: 6, 
                opacity: 0.8 
            }).addTo(map);
        } else {
            routeLayer = L.polyline(coordinates, { 
                color: '#16a34a', 
                weight: 5, 
                opacity: 0.9,
                dashArray: '6, 10'
            }).addTo(map);
        }

        map.fitBounds(routeLayer.getBounds(), { padding: [60, 60] });

        // Příprava dat pro plovoucí panel
        const modeText = profile === 'car' ? '🚗 Autem' : '🥾 Pěšky';
        const travelMode = profile === 'car' ? 'driving' : 'walking';
        const externalNavUrl = `https://www.google.com/maps/dir/?api=1&origin=${userLat},${userLon}&destination=${toLat},${toLon}&travelmode=${travelMode}`;

        // Naplnění a zobrazení karty v rohu mapy
        document.getElementById('route-title').innerText = `📍 Trasa (${modeText})`;
        document.getElementById('route-details').innerHTML = `
            <div><strong>Vzdálenost:</strong> ${distanceKm} km</div>
            <div><strong>Předpokládaný čas:</strong> ${timeText}</div>
        `;
        
        const startBtn = document.getElementById('route-start-btn');
        startBtn.onclick = () => window.open(externalNavUrl, '_blank');

        document.getElementById('route-info-box').style.display = 'block';

    } catch (e) {
        console.error('Chyba při načítání trasy:', e);
        alert('Nepodařilo se načíst trasu.');
    }
}
        function getDistanceFromLatLonInKm(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * (Math.PI / 180);
            const dLon = (lon2 - lon1) * (Math.PI / 180);
            const a = 
                Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(lat1 * (Math.PI / 180)) * Math.cos(lat2 * (Math.PI / 180)) * 
                Math.sin(dLon / 2) * Math.sin(dLon / 2); 
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)); 
            return R * c;
        }

        function getUserLocation() {
            if (!navigator.geolocation) {
                return alert('Váš prohlížeč nepodporuje geolokaci.');
            }

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    userLat = position.coords.latitude;
                    userLon = position.coords.longitude;

                    if (userLocationMarker) map.removeLayer(userLocationMarker);

                    userLocationMarker = L.marker([userLat, userLon], { icon: blueIcon }).addTo(map);
                    userLocationMarker.bindPopup('<b>📍 Tvoje aktuální poloha</b>').openPopup();

                    map.flyTo([userLat, userLon], 10, { duration: 1.5 });
                    document.getElementById('filter-radius').style.display = 'block';

                    applyFilters();
                },
                () => {
                    alert('Nepodařilo se získat vaši polohu. Povolte přístup k poloze v prohlížeči.');
                }
            );
        }

        function setTypeFilter(type, element) {
            selectedType = type;
            document.querySelectorAll('.type-pill').forEach(el => el.classList.remove('active'));
            element.classList.add('active');
            applyFilters();
        }

        function handleSearchInput() {
            const query = document.getElementById('filter-search').value.toLowerCase().trim();
            const autoBox = document.getElementById('autocomplete-box');

            applyFilters();

            if (query.length < 3) {
                autoBox.style.display = 'none';
                return;
            }

            const matches = allCastles.filter(c => {
                const name = (c.nazev || c.name || '').toLowerCase();
                return name.includes(query);
            }).slice(0, 8);

            if (matches.length === 0) {
                autoBox.style.display = 'none';
                return;
            }

            autoBox.innerHTML = '';
            matches.forEach(c => {
                const item = document.createElement('div');
                item.className = 'autocomplete-item';
                
                const typNazev = c.typ === 'zamek' ? '🏛️ Zámek' : (c.typ === 'zricenina' ? '🧱 Zřícenina' : '🏰 Hrad');
                item.innerHTML = `<strong>${c.nazev}</strong> <small style="color:#64748b;">${typNazev}</small>`;
                
                item.onclick = () => {
                    document.getElementById('filter-search').value = c.nazev;
                    autoBox.style.display = 'none';
                    applyFilters();
                    focusCastleOnMap(c);
                };

                autoBox.appendChild(item);
            });

            autoBox.style.display = 'block';
        }

        document.addEventListener('click', (e) => {
            const autoBox = document.getElementById('autocomplete-box');
            const searchInput = document.getElementById('filter-search');
            if (e.target !== searchInput && e.target !== autoBox) {
                autoBox.style.display = 'none';
            }
        });

        function applyFilters() {
            markersGroup.clearLayers();
            markersMap = {};

            const searchQuery = document.getElementById('filter-search').value.toLowerCase().trim();
            const selectedKraj = document.getElementById('filter-kraj').value.toLowerCase().trim();
            const autoOnly = document.getElementById('filter-auto').checked;
            const kocarekOnly = document.getElementById('filter-kocarek').checked;
            const maxRadius = parseFloat(document.getElementById('filter-radius').value);

            const filtered = allCastles.filter(c => {
                const lat = c.lat || c.latitude;
                const lon = c.lon || c.lng || c.longitude;
                if (!lat || !lon) return false;

                const castleName = (c.nazev || c.name || '').toLowerCase();
                const fullText = `${c.kraj || ''} ${castleName}`.toLowerCase();
                
                const matchSearch = !searchQuery || castleName.includes(searchQuery);
                const matchType = selectedType === 'all' || (c.typ && (c.typ === selectedType || c.typ.includes(selectedType)));
                const matchKraj = !selectedKraj || fullText.includes(selectedKraj);
                const matchAuto = !autoOnly || (c.auto === 1 || c.auto === true);
                const matchKocarek = !kocarekOnly || (c.kocarek === 1 || c.kocarek === true);

                let matchDistance = true;
                if (userLat && userLon && maxRadius < 9000) {
                    const dist = getDistanceFromLatLonInKm(userLat, userLon, lat, lon);
                    c.distance = dist;
                    matchDistance = dist <= maxRadius;
                }

                return matchSearch && matchType && matchKraj && matchAuto && matchKocarek && matchDistance;
            });

            document.getElementById('stats-badge').innerText = `Zobrazeno ${filtered.length} památek`;

            filtered.forEach(c => {
                const lat = c.lat || c.latitude;
                const lon = c.lon || c.lng || c.longitude;

                const marker = L.marker([lat, lon], { icon: c.is_visited ? greenIcon : redIcon });
                const img = c.foto ? `<img src="${c.foto}" alt="${c.nazev}">` : '';
                const typNazev = c.typ === 'zamek' ? 'Zámek' : (c.typ === 'zricenina' ? 'Zřícenina' : 'Hrad');

                const restaurantUrl = `https://mapy.cz/turisticka?q=restaurace&x=${lon}&y=${lat}&z=14`;
                const infoUrl = `https://cs.wikipedia.org/wiki/${encodeURIComponent(c.nazev || c.name)}`;

                let visitMetaHtml = '';
                if (c.is_visited) {
                    const stars = '⭐'.repeat(c.rating || 0);
                    const dateFormatted = c.visited_at ? new Date(c.visited_at).toLocaleDateString('cs-CZ') : '';
                    visitMetaHtml = `
                        <div style="font-size: 0.8rem; background: #f1f5f9; padding: 6px; border-radius: 6px; margin: 6px 0; color: #475569;">
                            ${stars ? `<div>${stars}</div>` : ''}
                            ${dateFormatted ? `<div>🗓️ ${dateFormatted}</div>` : ''}
                            ${c.note ? `<div style="font-style: italic; margin-top: 2px;">"${c.note}"</div>` : ''}
                        </div>
                    `;
                }

                const distHtml = c.distance ? `<div style="font-size: 0.8rem; font-weight: 600; color: #0284c7; margin-bottom: 4px;">📍 Vzdálenost: ${c.distance.toFixed(1)} km</div>` : '';

                // Dynamická tlačítka pro navigaci
                let navHtml = '';
if (userLat && userLon) {
    navHtml = `
        <div style="display: flex; gap: 6px; margin-bottom: 8px;">
            <button onclick="showRouteOnMap(${lat}, ${lon}, 'car')" class="popup-link-btn" style="background: #2563eb; flex: 1; border: none; cursor: pointer;">
                🚗 Autem
            </button>
            <button onclick="showRouteOnMap(${lat}, ${lon}, 'foot')" class="popup-link-btn" style="background: #16a34a; flex: 1; border: none; cursor: pointer;">
                🥾 Pěšky
            </button>
        </div>
    `;
} else {
                    const gmapsUrl = `https://www.google.com/maps/dir/?api=1&destination=${lat},${lon}`;
                    navHtml = `
                        <a href="${gmapsUrl}" target="_blank" class="popup-link-btn" style="background: #2563eb; margin-bottom: 8px; font-size: 0.8rem;">
                            🗺️ Trasa v Google Maps
                        </a>
                    `;
                }

                marker.bindPopup(`
                    <div class="castle-popup">
                        ${img}
                        <h3>${c.nazev || c.name}</h3>
                        <span class="badge">${typNazev} • ${c.kraj || ''}</span>
                        ${distHtml}
                        
                        ${visitMetaHtml}

                        ${navHtml}

                        <div class="popup-links">
                            <a href="${restaurantUrl}" target="_blank" class="popup-link-btn btn-food">
                                <i class="fa-solid fa-utensils"></i> Restaurace v okolí
                            </a>
                            <a href="${infoUrl}" target="_blank" class="popup-link-btn btn-web">
                                <i class="fa-solid fa-circle-info"></i> Otvírací doba & Info
                            </a>
                        </div>

                        <button class="btn-hunt ${c.is_visited ? 'visited' : ''}" onclick="openHuntModal(${c.id})">
                            ${c.is_visited ? '✓ Uloveno (Upravit)' : 'Ulovit hrad!'}
                        </button>
                    </div>
                `);
                markersGroup.addLayer(marker);
                markersMap[c.id] = marker;
            });
        }

        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        function setRating(stars) {
            selectedRating = stars;
            const starIcons = document.querySelectorAll('#star-container .fa-star');
            starIcons.forEach((star, index) => {
                if (index < stars) {
                    star.classList.add('active');
                } else {
                    star.classList.remove('active');
                }
            });
        }

        function openHuntModal(castleId) {
            if (!isLoggedIn) return alert('Nejdříve se přihlaste!');
            
            const castle = allCastles.find(c => c.id === castleId);
            if (!castle) return;

            currentHuntCastleId = castleId;
            document.getElementById('hunt-modal-title').innerText = `🏰 ${castle.nazev}`;

            const today = new Date().toISOString().split('T')[0];
            document.getElementById('hunt-date').value = castle.visited_at || today;
            document.getElementById('hunt-note').value = castle.note || '';
            setRating(castle.rating || 0);

            document.getElementById('delete-visit-btn').style.display = castle.is_visited ? 'block' : 'none';

            openModal('hunt-modal');
        }

        async function submitVisit() {
            if (!currentHuntCastleId) return;

            const visited_at = document.getElementById('hunt-date').value;
            const note = document.getElementById('hunt-note').value;

            const res = await fetch(`/api/castle/${currentHuntCastleId}/visit`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    visited_at: visited_at,
                    rating: selectedRating,
                    note: note
                })
            });

            if (res.ok) {
                closeModal('hunt-modal');
                loadCastles();
            } else {
                alert('Chyba při ukládání úlovku.');
            }
        }

        async function deleteVisit() {
            if (!currentHuntCastleId || !confirm('Opravdu chceš tuto památku odebrat z ulovených?')) return;

            const res = await fetch(`/api/castle/${currentHuntCastleId}/visit`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ action: 'delete' })
            });

            if (res.ok) {
                closeModal('hunt-modal');
                loadCastles();
            } else {
                alert('Chyba při odstraňování.');
            }
        }

        async function checkAuthStatus() {
            try {
                const res = await fetch('/api/user-status');
                const data = await res.json();
                isLoggedIn = data.logged_in;
                
                if (data.logged_in) {
                    document.getElementById('user-info').innerText = `👤 ${data.username}`;
                    document.getElementById('login-btn').style.display = 'none';
                    document.getElementById('register-btn').style.display = 'none';
                    document.getElementById('profile-btn').style.display = 'inline-block';
                    document.getElementById('logout-btn').style.display = 'inline-block';
                } else {
                    document.getElementById('user-info').innerText = '';
                    document.getElementById('login-btn').style.display = 'inline-block';
                    document.getElementById('register-btn').style.display = 'inline-block';
                    document.getElementById('profile-btn').style.display = 'none';
                    document.getElementById('logout-btn').style.display = 'none';
                }
            } catch(e) { console.error('Chyba kontroly přihlášení:', e); }
        }

        async function openProfile() {
            const res = await fetch('/api/user/visited');
            if (!res.ok) return alert('Chyba při načítání profilu.');
            
            const visited = await res.json();
            const listContainer = document.getElementById('profile-visited-list');
            const statsContainer = document.getElementById('profile-stats');

            statsContainer.innerText = `Celkem uloveno: ${visited.length} památek`;
            listContainer.innerHTML = '';

            if (visited.length === 0) {
                listContainer.innerHTML = '<p style="text-align:center; color: #94a3b8; padding: 20px 0;">Zatím nemáš ulovené žádné památky.</p>';
            } else {
                visited.forEach(c => {
                    const item = document.createElement('div');
                    item.className = 'profile-item';
                    item.onclick = () => focusCastleOnMap(c);

                    const img = c.foto ? `<img src="${c.foto}" style="width: 52px; height: 52px; object-fit: cover; border-radius: 6px;">` : '<span style="font-size:1.5rem;">🏰</span>';
                    const typNazev = c.typ === 'zamek' ? 'Zámek' : (c.typ === 'zricenina' ? 'Zřícenina' : 'Hrad');
                    
                    const stars = c.rating ? '⭐'.repeat(c.rating) : '';
                    const dateFormatted = c.visited_at ? new Date(c.visited_at).toLocaleDateString('cs-CZ') : '';

                    item.innerHTML = `
                        ${img}
                        <div style="flex-grow: 1;">
                            <strong style="display:block; font-size: 0.95rem; color: #1e293b;">${c.nazev}</strong>
                            <small style="color: #64748b;">${typNazev} • ${c.kraj}</small>
                            ${dateFormatted ? `<small style="display:block; color: #3b82f6; font-size: 0.75rem;">🗓️ ${dateFormatted} ${stars}</small>` : ''}
                            ${c.note ? `<div style="font-size: 0.75rem; font-style: italic; color: #475569; margin-top:2px;">"${c.note}"</div>` : ''}
                        </div>
                        <i class="fa-solid fa-location-crosshairs" style="color: #3b82f6;"></i>
                    `;
                    listContainer.appendChild(item);
                });
            }

            openModal('profile-modal');
        }

        async function openLeaderboard() {
            const res = await fetch('/api/leaderboard');
            if (!res.ok) return alert('Chyba při načítání žebříčku.');

            const data = await res.json();
            const listContainer = document.getElementById('leaderboard-list');
            listContainer.innerHTML = '';

            if (data.length === 0) {
                listContainer.innerHTML = '<p style="text-align:center; color: #94a3b8; padding: 20px 0;">Zatím zde nejsou žádní lovci.</p>';
            } else {
                data.forEach((user, index) => {
                    const rank = index + 1;
                    const item = document.createElement('div');
                    item.className = 'leaderboard-item';

                    let medal = `#${rank}`;
                    let rankClass = '';
                    if (rank === 1) { medal = '🥇'; rankClass = 'rank-1'; }
                    else if (rank === 2) { medal = '🥈'; rankClass = 'rank-2'; }
                    else if (rank === 3) { medal = '🥉'; rankClass = 'rank-3'; }

                    item.innerHTML = `
                        <div class="rank-badge ${rankClass}">${medal}</div>
                        <div style="flex-grow: 1;">
                            <strong style="display:block; font-size: 0.95rem; color: #1e293b;">${user.username}</strong>
                        </div>
                        <span style="font-weight: 700; color: #3b82f6; font-size: 0.9rem;">${user.count} uloveno</span>
                    `;
                    listContainer.appendChild(item);
                });
            }

            openModal('leaderboard-modal');
        }

        function focusCastleOnMap(castle) {
            closeModal('profile-modal');
            const lat = castle.lat || castle.latitude;
            const lon = castle.lon || castle.lng || castle.longitude;

            map.flyTo([lat, lon], 14, { duration: 1.5 });

            setTimeout(() => {
                if (markersMap[castle.id]) {
                    markersMap[castle.id].openPopup();
                }
            }, 1600);
        }

        async function login() {
            const username = document.getElementById('login-user').value;
            const password = document.getElementById('login-pass').value;
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username, password})
            });
            const data = await res.json();
            if (res.ok) { closeModal('login-modal'); checkAuthStatus(); loadCastles(); } 
            else alert(data.error);
        }

        async function register() {
            const username = document.getElementById('reg-user').value;
            const password = document.getElementById('reg-pass').value;
            const res = await fetch('/api/register', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username, password})
            });
            const data = await res.json();
            if (res.ok) { alert(data.message); closeModal('register-modal'); openModal('login-modal'); } 
            else alert(data.error);
        }

        async function logout() {
            await fetch('/api/logout', {method: 'POST'});
            checkAuthStatus();
            loadCastles();
        }

        checkAuthStatus();
        loadCastles();
    </script>
</body>
</html>
