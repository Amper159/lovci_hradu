<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lovci Hradů - Průvodce po památkách</title>

    <!-- Google Fonts & FontAwesome ikony -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        :root {
            --primary: #1e293b;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --success: #10b981;
            --purple: #8b5cf6;
            --purple-hover: #7c3aed;
            --bg-sidebar: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
        }

        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            background-color: #f8fafc;
            color: var(--text-main);
        }

        header {
            background-color: var(--primary);
            color: #ffffff;
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            z-index: 1000;
        }

        header h2 {
            margin: 0;
            font-size: 1.25rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .auth-buttons button {
            background: var(--accent);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            margin-left: 8px;
            font-weight: 600;
            font-size: 0.875rem;
            transition: all 0.2s;
        }
        .auth-buttons button:hover { background: var(--accent-hover); }
        .auth-buttons button.profile { background: var(--purple); }
        .auth-buttons button.profile:hover { background: var(--purple-hover); }
        .auth-buttons button.logout { background: #ef4444; }

        .main-container {
            display: flex;
            flex-grow: 1;
            overflow: hidden;
        }

        /* Boční panel */
        .sidebar {
            width: 320px;
            background-color: var(--bg-sidebar);
            padding: 24px;
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 20px;
            z-index: 500;
            box-shadow: 2px 0 8px rgba(0,0,0,0.02);
            overflow-y: auto;
        }

        .sidebar h3 { 
            margin: 0; 
            font-size: 1.1rem; 
            font-weight: 700; 
            color: var(--primary); 
        }

        .filter-section {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .filter-label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .type-pills {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .type-pill {
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            background: #f1f5f9;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
            user-select: none;
        }

        .type-pill.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        select {
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            width: 100%;
            font-family: inherit;
            font-size: 0.9rem;
            background-color: #ffffff;
            color: var(--text-main);
        }

        .checkbox-card {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            background: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
        }
        .checkbox-card input { cursor: pointer; }

        .stats-badge {
            margin-top: auto;
            padding: 12px;
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            border-radius: 8px;
            color: #1e40af;
            font-size: 0.85rem;
            font-weight: 600;
            text-align: center;
        }

        #map { flex-grow: 1; height: 100%; }

        /* Popup okna */
        .castle-popup { text-align: center; max-width: 240px; font-family: 'Inter', sans-serif; }
        .castle-popup img { width: 100%; height: 120px; object-fit: cover; border-radius: 6px; margin-bottom: 8px; }
        .castle-popup h3 { margin: 4px 0; font-size: 1rem; font-weight: 700; color: var(--primary); }
        .castle-popup .badge { display: inline-block; padding: 2px 8px; background: #e2e8f0; font-size: 0.75rem; border-radius: 12px; font-weight: 600; margin-bottom: 8px; }
        
        .popup-links {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin: 10px 0;
        }

        .popup-link-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            text-decoration: none;
            padding: 8px 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            color: #ffffff !important;
            transition: opacity 0.2s;
        }
        .popup-link-btn i { color: #ffffff !important; }
        .popup-link-btn:hover { opacity: 0.9; }

        .btn-food { background-color: #d97706 !important; }
        .btn-web { background-color: #1e293b !important; }

        .btn-hunt {
            background-color: #ef4444; color: white; border: none;
            padding: 9px; border-radius: 6px; cursor: pointer; width: 100%;
            font-weight: 600; font-size: 0.85rem; transition: background 0.2s;
        }
        .btn-hunt.visited { background-color: var(--success); }

        /* Modální okna */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); z-index: 2000;
            justify-content: center; align-items: center;
        }
        .modal-content {
            background: white; padding: 28px; border-radius: 12px; width: 340px;
            display: flex; flex-direction: column; gap: 12px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1);
        }
        .modal-content input { padding: 10px; border: 1px solid var(--border-color); border-radius: 6px; font-family: inherit; }
        .modal-content button { background: var(--success); color: white; border: none; padding: 10px; border-radius: 6px; cursor: pointer; font-weight: 600; }
        .close-btn { background: #94a3b8 !important; }

        .profile-item {
            display: flex; align-items: center; gap: 12px; padding: 10px;
            border: 1px solid var(--border-color); border-radius: 8px;
            background: #f8fafc; cursor: pointer; transition: all 0.2s;
        }
        .profile-item:hover {
            background: #f1f5f9; border-color: var(--accent); transform: translateY(-1px);
        }
    </style>
</head>
<body>

    <header>
        <h2><i class="fa-solid fa-chess-rook"></i> Lovci Hradů</h2>
        <div id="auth-section" class="auth-buttons">
            <span id="user-info" style="margin-right: 10px; font-size: 0.9rem;"></span>
            <button id="profile-btn" class="profile" style="display:none;" onclick="openProfile()"><i class="fa-solid fa-user-check"></i> Můj profil</button>
            <button id="login-btn" onclick="openModal('login-modal')"><i class="fa-solid fa-right-to-bracket"></i> Přihlásit</button>
            <button id="register-btn" onclick="openModal('register-modal')"><i class="fa-solid fa-user-plus"></i> Registrovat</button>
            <button id="logout-btn" class="logout" style="display:none;" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> Odhlásit</button>
        </div>
    </header>

    <div class="main-container">
        <!-- Boční filtr -->
        <div class="sidebar">
            <h3>Filtrovat památky</h3>

            <!-- Typ památky -->
            <div class="filter-section">
                <span class="filter-label">Typ objektu</span>
                <div class="type-pills">
                    <div class="type-pill active" onclick="setTypeFilter('all', this)">Vše</div>
                    <div class="type-pill" onclick="setTypeFilter('hrad', this)">🏰 Hrady</div>
                    <div class="type-pill" onclick="setTypeFilter('zamek', this)">🏛️ Zámky</div>
                    <div class="type-pill" onclick="setTypeFilter('zricenina', this)">🧱 Zříceniny</div>
                </div>
            </div>

            <!-- Kraj -->
            <div class="filter-section">
                <span class="filter-label">Kraj</span>
                <select id="filter-kraj" onchange="applyFilters()">
                    <option value="">Všechny kraje</option>
                    <option value="Jihočeský">Jihočeský</option>
                    <option value="Jihomoravský">Jihomoravský</option>
                    <option value="Karlovarský">Karlovarský</option>
                    <option value="Královéhradecký">Královéhradecký</option>
                    <option value="Liberecký">Liberecký</option>
                    <option value="Moravskoslezský">Moravskoslezský</option>
                    <option value="Olomoucký">Olomoucký</option>
                    <option value="Pardubický">Pardubický</option>
                    <option value="Plzeňský">Plzeňský</option>
                    <option value="Praha">Praha</option>
                    <option value="Středočeský">Středočeský</option>
                    <option value="Ústecký">Ústecký</option>
                    <option value="Vysočina">Vysočina</option>
                    <option value="Zlínský">Zlínský</option>
                </select>
            </div>

            <!-- Vlastnosti -->
            <div class="filter-section">
                <span class="filter-label">Dostupnost</span>
                <label class="checkbox-card">
                    <input type="checkbox" id="filter-auto" onchange="applyFilters()">
                    <span>🚗 Parkování v blízkosti</span>
                </label>
                <label class="checkbox-card">
                    <input type="checkbox" id="filter-kocarek" onchange="applyFilters()">
                    <span>👶 Vhodné pro kočárek</span>
                </label>
            </div>

            <div id="stats-badge" class="stats-badge">
                Zobrazeno 0 památek
            </div>
        </div>

        <!-- Mapa -->
        <div id="map"></div>
    </div>

    <!-- Modální okno: Přihlášení -->
    <div id="login-modal" class="modal">
        <div class="modal-content">
            <h3>Přihlášení</h3>
            <input type="text" id="login-user" placeholder="Uživatelské jméno">
            <input type="password" id="login-pass" placeholder="Heslo">
            <button onclick="login()">Přihlásit se</button>
            <button class="close-btn" onclick="closeModal('login-modal')">Zavřít</button>
        </div>
    </div>

    <!-- Modální okno: Registrace -->
    <div id="register-modal" class="modal">
        <div class="modal-content">
            <h3>Registrace</h3>
            <input type="text" id="reg-user" placeholder="Uživatelské jméno">
            <input type="password" id="reg-pass" placeholder="Heslo">
            <button onclick="register()">Vytvořit účet</button>
            <button class="close-btn" onclick="closeModal('register-modal')">Zavřít</button>
        </div>
    </div>

    <!-- Modální okno: Profil uživatele -->
    <div id="profile-modal" class="modal">
        <div class="modal-content" style="width: 440px; max-height: 80vh;">
            <h3>🏆 Moje ulovené památky</h3>
            <div id="profile-stats" style="font-weight: 600; color: #475569; font-size: 0.9rem;"></div>
            
            <div id="profile-visited-list" style="display: flex; flex-direction: column; gap: 8px; max-height: 360px; overflow-y: auto; padding-right: 4px;">
                <!-- Sem se načtou kartičky -->
            </div>

            <button class="close-btn" style="margin-top: 10px;" onclick="closeModal('profile-modal')">Zavřít</button>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map').setView([49.8175, 15.4730], 8);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap' }).addTo(map);

        let allCastles = [];
        let markersMap = {};
        let selectedType = 'all';
        let markersGroup = L.layerGroup().addTo(map);

        const redIcon = new L.Icon({
            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png',
            shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
            iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34], shadowSize: [41, 41]
        });

        const greenIcon = new L.Icon({
            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-green.png',
            shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
            iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34], shadowSize: [41, 41]
        });

        async function loadCastles() {
            try {
                const response = await fetch('/api/castles');
                allCastles = await response.json();
                applyFilters();
            } catch (e) { console.error('Chyba načítání dat:', e); }
        }

        function setTypeFilter(type, element) {
            selectedType = type;
            document.querySelectorAll('.type-pill').forEach(el => el.classList.remove('active'));
            element.classList.add('active');
            applyFilters();
        }

        function applyFilters() {
            markersGroup.clearLayers();
            markersMap = {};

            const selectedKraj = document.getElementById('filter-kraj').value.toLowerCase().trim();
            const autoOnly = document.getElementById('filter-auto').checked;
            const kocarekOnly = document.getElementById('filter-kocarek').checked;

            const filtered = allCastles.filter(c => {
                const fullText = `${c.kraj || ''} ${c.nazev || ''}`.toLowerCase();
                
                const matchType = selectedType === 'all' || (c.typ && (c.typ === selectedType || c.typ.includes(selectedType)));
                const matchKraj = !selectedKraj || fullText.includes(selectedKraj);
                const matchAuto = !autoOnly || (c.auto === 1 || c.auto === true);
                const matchKocarek = !kocarekOnly || (c.kocarek === 1 || c.kocarek === true);

                return matchType && matchKraj && matchAuto && matchKocarek;
            });

            document.getElementById('stats-badge').innerText = `Zobrazeno ${filtered.length} památek`;

            filtered.forEach(c => {
                const lat = c.lat || c.latitude;
                const lon = c.lon || c.lng || c.longitude;
                if (!lat || !lon) return;

                const marker = L.marker([lat, lon], { icon: c.is_visited ? greenIcon : redIcon });
                const img = c.foto ? `<img src="${c.foto}" alt="${c.nazev}">` : '';
                const typNazev = c.typ === 'zamek' ? 'Zámek' : (c.typ === 'zricenina' ? 'Zřícenina' : 'Hrad');

                // Dynamické odkazy
                const restaurantUrl = `https://mapy.cz/turisticka?q=restaurace&x=${lon}&y=${lat}&z=14`;
                const infoUrl = `https://cs.wikipedia.org/wiki/${encodeURIComponent(c.nazev || c.name)}`;

                marker.bindPopup(`
                    <div class="castle-popup">
                        ${img}
                        <h3>${c.nazev || c.name}</h3>
                        <span class="badge">${typNazev} • ${c.kraj || ''}</span>
                        
                        <div class="popup-links">
                            <a href="${restaurantUrl}" target="_blank" class="popup-link-btn btn-food">
                                <i class="fa-solid fa-utensils"></i> Restaurace v okolí
                            </a>
                            <a href="${infoUrl}" target="_blank" class="popup-link-btn btn-web">
                                <i class="fa-solid fa-circle-info"></i> Otvírací doba & Info
                            </a>
                        </div>

                        <button class="btn-hunt ${c.is_visited ? 'visited' : ''}" onclick="toggleVisit(${c.id})">
                            ${c.is_visited ? '✓ Uloveno' : 'Ulovit hrad!'}
                        </button>
                    </div>
                `);
                markersGroup.addLayer(marker);
                markersMap[c.id] = marker;
            });
        }

        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        async function checkAuthStatus() {
            try {
                const res = await fetch('/api/user-status');
                const data = await res.json();
                if (data.logged_in) {
                    document.getElementById('user-info').innerText = `👤 ${data.username}`;
                    document.getElementById('login-btn').style.display = 'none';
                    document.getElementById('register-btn').style.display = 'none';
                    document.getElementById('profile-btn').style.display = 'inline-block';
                    document.getElementById('logout-btn').style.display = 'inline-block';
                } else {
                    document.getElementById('user-info').innerText = '';
                    document.getElementById('login-btn').style.display = 'inline-block';
                    document.getElementById('register-btn').style.display = 'inline-block';
                    document.getElementById('profile-btn').style.display = 'none';
                    document.getElementById('logout-btn').style.display = 'none';
                }
            } catch(e) { console.error('Chyba kontroly přihlášení:', e); }
        }

        async function openProfile() {
            const res = await fetch('/api/user/visited');
            if (!res.ok) return alert('Chyba při načítání profilu.');
            
            const visited = await res.json();
            const listContainer = document.getElementById('profile-visited-list');
            const statsContainer = document.getElementById('profile-stats');

            statsContainer.innerText = `Celkem uloveno: ${visited.length} památek`;
            listContainer.innerHTML = '';

            if (visited.length === 0) {
                listContainer.innerHTML = '<p style="text-align:center; color: #94a3b8; padding: 20px 0;">Zatím nemáš ulovené žádné památky.</p>';
            } else {
                visited.forEach(c => {
                    const item = document.createElement('div');
                    item.className = 'profile-item';
                    item.onclick = () => focusCastleOnMap(c);

                    const img = c.foto ? `<img src="${c.foto}" style="width: 48px; height: 48px; object-fit: cover; border-radius: 6px;">` : '<span style="font-size:1.5rem;">🏰</span>';
                    const typNazev = c.typ === 'zamek' ? 'Zámek' : (c.typ === 'zricenina' ? 'Zřícenina' : 'Hrad');

                    item.innerHTML = `
                        ${img}
                        <div style="flex-grow: 1;">
                            <strong style="display:block; font-size: 0.95rem; color: #1e293b;">${c.nazev}</strong>
                            <small style="color: #64748b;">${typNazev} • ${c.kraj}</small>
                        </div>
                        <i class="fa-solid fa-location-crosshairs" style="color: #3b82f6;"></i>
                    `;
                    listContainer.appendChild(item);
                });
            }

            openModal('profile-modal');
        }

        function focusCastleOnMap(castle) {
            closeModal('profile-modal');
            const lat = castle.lat || castle.latitude;
            const lon = castle.lon || castle.lng || castle.longitude;

            map.flyTo([lat, lon], 14, { duration: 1.5 });

            setTimeout(() => {
                if (markersMap[castle.id]) {
                    markersMap[castle.id].openPopup();
                }
            }, 1600);
        }

        async function login() {
            const username = document.getElementById('login-user').value;
            const password = document.getElementById('login-pass').value;
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username, password})
            });
            const data = await res.json();
            if (res.ok) { closeModal('login-modal'); checkAuthStatus(); loadCastles(); } 
            else alert(data.error);
        }

        async function register() {
            const username = document.getElementById('reg-user').value;
            const password = document.getElementById('reg-pass').value;
            const res = await fetch('/api/register', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username, password})
            });
            const data = await res.json();
            if (res.ok) { alert(data.message); closeModal('register-modal'); openModal('login-modal'); } 
            else alert(data.error);
        }

        async function logout() {
            await fetch('/api/logout', {method: 'POST'});
            checkAuthStatus();
            loadCastles();
        }

        async function toggleVisit(id) {
            const res = await fetch(`/api/castle/${id}/visit`, {method: 'POST'});
            if (res.status === 401) return alert('Nejdříve se přihlaste!');
            loadCastles();
        }

        checkAuthStatus();
        loadCastles();
    </script>
</body>
</html>
